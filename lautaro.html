<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lautaro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles/lautaro.css" />
  </head>
  <body>
    <div
      class="d-flex flex-column justify-content-center align-items-center h-100"
    >
      <div class="card" style="width: 16rem">
        <img
          src="./img/lautaro.jpg"
          class="card-img-top"
          alt="Foto de perfil"
          style="height: 200px"
        />
        <div class="card-body">
          <h5 class="card-title text-center">Lautaro Colella</h5>
          <div class="card-header text-center">Habilidades</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">Código morse</li>
            <li class="list-group-item">Braille</li>
            <li class="list-group-item">Programación</li>
            <li class="list-group-item">Ciberseguridad</li>
          </ul>
          <div class="card-header text-center">Películas</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">Snowden</li>
            <li class="list-group-item">Silk Road</li>
            <li class="list-group-item">The Fifth Estate</li>
          </ul>
          <div class="card-header text-center">Música</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">Wish</li>
            <li class="list-group-item">Dance in the game</li>
            <li class="list-group-item">Аигел Пыяла (Aigel Piyala)</li>
          </ul>
          <p class="card-text text-center mt-2">Mar del Plata, 22 años</p>
          <div class="card-footer text-center">
            <a href="./index.html" class="btn btn-primary"
              ><i class="fa-solid fa-chevron-left"></i> Portada</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
