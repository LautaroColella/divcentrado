<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lautaro | Grupo 4</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles/lautaro.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body>
    <div
      class="d-flex flex-column justify-content-center align-items-center h-100"
    >
      <div class="card profile-card">
        <img
          src="./img/lautaro.jpg"
          class="card-img-top"
          alt="Foto de perfil"
        />
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Lautaro Colella</h5>

          <div class="profile-section">
            <div class="profile-section-title">Habilidades</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">Código morse</li>
              <li class="list-group-item">Braille</li>
              <li class="list-group-item">Programación</li>
              <li class="list-group-item">Ciberseguridad</li>
            </ul>
          </div>

          <div class="profile-section">
            <div class="profile-section-title">Películas</div>
            <ul class="list-group list-group-flush">
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Snowden
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/QlSAiI3xMh4"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Silk Road
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/LBOBuqBzn7w"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                The Fifth Estate
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/YQOiS_l_0Jk"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
            </ul>
          </div>

          <div class="profile-section">
            <div class="profile-section-title">Música</div>
            <ul class="list-group list-group-flush">
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Wish
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/ZjSKNGPTFFs"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Dance in the game
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/Zm24Y_f6qQk"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Аигел Пыяла
                <a
                  href="#"
                  class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#videoModal"
                  data-video="https://www.youtube.com/embed/pBOVVwUja6E"
                >
                  <i class="fa-brands fa-youtube"></i>
                </a>
              </li>
            </ul>
          </div>

          <hr />
          <p class="card-text text-center mt-2">Mar del Plata, 22 años</p>
          <div class="card-footer text-center bg-transparent border-0">
            <a href="./index.html" class="btn btn-primary">
              <i class="fa-solid fa-chevron-left"></i> Portada
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body p-0">
            <div class="ratio ratio-16x9">
              <iframe
                id="videoFrame"
                src="google.com"
                title="YouTube video"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./scripts/lautaro.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
